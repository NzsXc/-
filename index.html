<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心理バトル</title>

<style>

*{
  box-sizing:border-box;
  user-select:none;
}

body{
  margin:0;
  min-height:100vh;
  background:#111;
  color:white;
  font-family:Arial,"Noto Sans JP",sans-serif;
  overflow:hidden;
}

.screen{
  display:none;
  width:100%;
  min-height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.screen.active{
  display:flex;
}


/* =========================
   起動画面
========================= */

#startScreen{
  background:#111;
  cursor:pointer;
}

.startTitle{
  font-size:42px;
  font-weight:900;
  letter-spacing:4px;
}

.startSub{
  margin-top:20px;
  opacity:.6;
  font-size:16px;
}


/* =========================
   モード選択
========================= */

#modeScreen{
  position:relative;
  padding:24px;
  overflow:hidden;
}

.screenTitle{
  font-size:32px;
  margin-bottom:20px;
}

.modeChoiceBox{
  width:min(720px,78vw);
  min-height:120px;
  display:grid;
  grid-template-columns:1fr 44px 1fr;
  align-items:stretch;
  border:2px solid rgba(255,255,255,.18);
  border-radius:22px;
  overflow:hidden;
  background:rgba(24,24,32,.92);
  box-shadow:0 18px 55px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
}

.modeChoiceButton{
  border:0;
  background:transparent;
  color:white;
  font-size:clamp(20px,3vw,30px);
  font-weight:900;
  cursor:pointer;
  touch-action:manipulation;
  transition:.15s;
}

.modeChoiceButton:hover,
.modeChoiceButton:active{
  background:rgba(255,255,255,.08);
}

.modeSlash{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.modeSlash::before{
  content:"";
  display:block;
  width:2px;
  height:62%;
  min-height:46px;
  background:rgba(255,255,255,.92);
  box-shadow:0 0 8px rgba(255,255,255,.28);
  transform:rotate(18deg);
  border-radius:999px;
}

.modeBottomButton{
  position:absolute;
  left:20px;
  bottom:18px;
  width:54px;
  height:54px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;
  background:#1b1b22;
  color:white;
  font-size:25px;
  cursor:pointer;
  box-shadow:0 8px 22px rgba(0,0,0,.35);
  touch-action:manipulation;
}

.modeSquareButton{
  position:absolute;
  right:18px;
  bottom:18px;
  width:76px;
  height:76px;
  border:2px solid rgba(255,255,255,.18);
  border-radius:16px;
  background:#1b1b22;
  color:white;
  font-size:32px;
  cursor:pointer;
  box-shadow:0 10px 28px rgba(0,0,0,.4);
  touch-action:manipulation;
}

.modeBottomButton:hover,
.modeSquareButton:hover{
  background:#292933;
}

/* =========================
   オンラインメニュー
========================= */

#onlineScreen{
  position:relative;
  padding:24px;
  overflow:hidden;
}

.onlineMenu{
  width:min(720px,82vw);
  margin-top:3vh;
  display:grid;
  gap:14px;
}

.onlineMainButton{
  width:100%;
  min-height:72px;
  border:2px solid rgba(255,255,255,.16);
  border-radius:18px;
  background:linear-gradient(145deg,#252833,#171922);
  color:white;
  font-size:clamp(19px,2.6vw,27px);
  font-weight:900;
  cursor:pointer;
  box-shadow:0 10px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05);
  touch-action:manipulation;
}

.onlineMainButton:hover,
.onlineMainButton:active{
  background:linear-gradient(145deg,#303544,#1c1f2a);
  transform:translateY(-1px);
}

.onlineSubRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.onlineSubButton{
  width:100%;
  min-height:54px;
  border:2px solid rgba(255,255,255,.14);
  border-radius:16px;
  background:#191b24;
  color:white;
  font-size:clamp(28px,4vw,42px);
  cursor:pointer;
  touch-action:manipulation;
}

.onlineSubButton:hover,
.onlineSubButton:active{
  background:#272a36;
}

.onlineBackButton{
  position:absolute;
  left:18px;
  bottom:18px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;
  background:#191b22;
  color:#ddd;
  padding:10px 18px;
  font-size:15px;
  cursor:pointer;
}

/* =========================
   TIP画面
========================= */

#tipScreen{
  position:relative;
  padding:24px;
}

.tipNav{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  width:min(360px,58vw);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  z-index:5;
}

.tipNavButton{
  aspect-ratio:1/1;
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  background:rgba(24,26,34,.92);
  color:#fff;
  font-size:clamp(11px,1.6vw,16px);
  font-weight:900;
  cursor:pointer;
  touch-action:manipulation;
  transition:transform .2s,background .2s,border-color .2s;
}

.tipNavButton.active{
  background:rgba(255,255,255,.14);
  border-color:rgba(255,255,255,.5);
  transform:translateY(-2px);
}

.tipViewport{
  width:min(820px,84vw);
  height:min(52vh,460px);
  margin-top:92px;
  overflow:hidden;
  border-radius:16px;
}

.tipPages{
  height:100%;
  display:flex;
  transition:transform .45s cubic-bezier(.2,.8,.2,1);
  will-change:transform;
}

.tipPage{
  flex:0 0 100%;
  height:100%;
  padding:4px;
}

.tipPageInner{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.16);
  border-radius:16px;
  background:rgba(24,26,34,.72);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  font-size:clamp(20px,4vw,34px);
  font-weight:900;
}

.tipBackButton{
  margin-top:16px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:12px;
  background:#191b22;
  color:#ddd;
  padding:10px 24px;
  font-size:16px;
  cursor:pointer;
}

/* =========================
   観戦UI
========================= */

.spectatorList{
  width:min(720px,88vw);
  max-height:62vh;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:8px;
  padding:4px;
}

.spectatorRow{
  width:100%;
  min-height:62px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  padding:10px 16px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:15px;
  background:linear-gradient(145deg,#252833,#171922);
  color:#fff;
  cursor:pointer;
  touch-action:manipulation;
}

.spectatorRow:hover,.spectatorRow:active{background:#2b2f3b;}
.spectatorPlayer{text-align:center;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.spectatorVs{font-weight:1000;color:#ddd;}
.spectatorEmpty{opacity:.65;text-align:center;padding:28px 10px;}
.spectatorTitle{display:flex;gap:12px;align-items:center;}
.spectatorBattleMirror{position:absolute;inset:0;pointer-events:none;}

#battleScreen.spectatorMode .action{pointer-events:none;filter:brightness(.65);cursor:default;}
#battleScreen.spectatorMode .action:hover{transform:none;box-shadow:none;}
#battleScreen.spectatorMode #player1Area,#battleScreen.spectatorMode #player2Area{pointer-events:none;}
.spectatorBadge{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:none;align-items:center;gap:10px;padding:7px 10px 7px 12px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(7,9,14,.82);backdrop-filter:blur(8px);box-shadow:0 8px 25px rgba(0,0,0,.3);font-size:12px;white-space:nowrap;}
.spectatorBadge button{border:1px solid rgba(255,255,255,.18);border-radius:999px;background:#252833;color:#fff;padding:5px 9px;cursor:pointer;}
.spectatorReadOnly{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:50;padding:6px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(10,12,18,.75);font-size:12px;opacity:.8;}

#spectatorScreen .onlineBackButton{z-index:100;pointer-events:auto;}
#spectatorScreen .playerArea{pointer-events:none;}
#spectatorScreen .action{pointer-events:none;}

@media(max-width:600px){
  .tipNav{top:10px;width:min(300px,68vw);gap:4px;}
  .tipViewport{width:92vw;height:52vh;margin-top:76px;}
  .spectatorList{width:92vw;max-height:66vh;}
  .spectatorRow{min-height:56px;padding:8px 10px;font-size:13px;}
}

/* =========================
   オンライン対戦開始
========================= */

/* =========================
   オンライン対戦開始
========================= */


/* =========================
   技選択
========================= */

.techSelect{
  width:min(820px,86vw);
  margin:2vh auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:14px;
}

.techCard{
  min-height:150px;
  position:relative;
  display:grid;
  grid-template-columns:42px 1fr 42px;
  align-items:center;
  gap:8px;
  padding:12px;
  border:2px solid rgba(255,255,255,.14);
  border-radius:18px;
  background:linear-gradient(145deg,#252833,#171922);
  box-shadow:0 10px 26px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05);
}

.techCard:nth-child(1){grid-column:1;grid-row:1;}
.techCard:nth-child(2){grid-column:2;grid-row:1;}
.techCard:nth-child(3){grid-column:1;grid-row:2;}

.techArrow{
  width:42px;
  height:58px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:11px;
  background:#1b1d26;
  color:white;
  font-size:23px;
  cursor:pointer;
  touch-action:manipulation;
}

.techArrow:hover,
.techArrow:active{
  background:#303442;
}

.techCardBody{
  min-width:0;
  text-align:center;
}

.techIcon{
  width:100%;
  min-height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(18px,2.4vw,25px);
  font-weight:900;
  overflow-wrap:anywhere;
}

.techCardDescription{
  margin-top:8px;
  color:#c9c9d1;
  font-size:clamp(11px,1.4vw,14px);
  line-height:1.45;
  text-align:left;
}

#techDescription{
  display:none;
}

#techConfirmButton{
  grid-column:2;
  grid-row:2;
  align-self:stretch;
  justify-self:stretch;
  width:auto;
  min-height:150px;
  padding:18px;
  border:2px solid rgba(255,255,255,.18);
  border-radius:18px;
  background:linear-gradient(145deg,#eff0f2,#e8e9eb);
  font-size:clamp(20px,2.8vw,30px);
  font-weight:900;
  cursor:pointer;
  touch-action:manipulation;
}

#techConfirmButton:hover{
  background:linear-gradient(145deg,#ffffff,#f4f4f5);
}


/* =========================
   バトル画面
========================= */

#battleScreen{
  position:relative;
  display:block;
  min-height:100vh;
  width:100%;
  padding:0;
  overflow:hidden;
}

.playerArea{
  position:absolute;
  width:270px;
  border:1px solid #444;
  border-radius:12px;
  padding:8px;
  background:#181818;
  z-index:2;
}

#player1Area{
  bottom:18px;
  left:18px;
}

#player2Area{
  top:18px;
  right:18px;
}

.playerHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.playerName{
  font-size:20px;
  font-weight:bold;
}

.hpText,
.gaugeText{
  font-size:16px;
}

.hpBar{
  width:100%;
  height:14px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:8px;
}

.hpFill{
  height:100%;
  width:100%;
  background:#e33;
  transition:.2s;
}

.hpFill.hpDamage,.hpText.hpDamage{animation:hpDamage .42s ease-out !important;}

.gaugeBar{
  width:100%;
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:12px;
}

.gaugeFill{
  height:100%;
  width:0%;
  background:#4aa3ff;
  transition:.2s;
}

.actionList{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
}

.action{
  min-height:42px;
  border:1px solid #666;
  border-radius:10px;
  background:#292929;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  transition:.15s;
  cursor:pointer;
}

.actionKey{
  font-size:10px;
  opacity:.6;
}

.actionName{
  font-size:11px;
  font-weight:bold;
  margin-top:4px;
}

.playerArea.locked .action{
  filter:brightness(.35);
}

.action.disabled{
  opacity:.3;
}


/* =========================
   中央
========================= */

#battleCenter{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:3;
  pointer-events:none;
}

.onlineTechniqueDescription{
  display:none;
  max-width:min(72vw,420px);
  margin-top:14px;
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:10px;
  background:rgba(8,10,16,.82);
  color:#e8e8ef;
  font-size:12px;
  line-height:1.45;
  text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.28);
  backdrop-filter:blur(6px);
}

#countdown{
  font-size:45px;
  font-weight:900;
}

#resultMessage{
  font-size:20px;
  min-height:28px;
  text-align:center;
}


/* =========================
   戦闘エフェクト
========================= */

#battleEffectLayer{
  position:absolute;
  inset:0;
  z-index:30;
  pointer-events:none;
  overflow:hidden;
}

.battleProjectile{
  position:absolute;
  width:22px;
  height:22px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:
    0 0 10px 4px currentColor,
    0 0 24px 8px currentColor;
}

.battleProjectile.p1{
  color:#ff4d4d;
  background:#fff;
}

.battleProjectile.p2{
  color:#4da6ff;
  background:#fff;
}

.momentumProjectile{
  width:30px !important;
  height:18px !important;
  border-radius:65% 38% 65% 38% !important;
  background:linear-gradient(135deg,#fff,#e9edf4 55%,#fff) !important;
  box-shadow:0 0 8px #fff,0 0 18px rgba(255,255,255,.9),0 0 35px rgba(190,205,225,.7) !important;
}
.momentumProjectile.p1{transform:translate(-50%,-50%) rotate(20deg) scaleX(-1);}
.momentumProjectile.p2{transform:translate(-50%,-50%) rotate(20deg);}


/* =========================
   行動名
========================= */

.battleActionLabel{
  position:absolute;
  z-index:6;

  font-size:42px;
  font-weight:900;

  padding:10px 20px;

  border-radius:12px;

  opacity:0;

  animation:actionLabelIn .8s ease-out forwards;

  text-shadow:
    0 0 10px currentColor,
    0 0 22px currentColor,
    0 0 40px currentColor;

  white-space:nowrap;
}


/* 1P：左下から中央寄り */

.battleActionLabel.p1{
  left:30%;
  bottom:30%;
  transform:translateX(-50%);
  color:#ff6b6b;
}

.battleActionLabel.p2{
  left:46%;
  top:30%;
  transform:translateX(-50%);
  color:#69aaff;
}
@keyframes actionLabelIn{
  0%{
    opacity:0;
    transform:scale(.75);
  }

  25%{
    opacity:1;
    transform:scale(1.08);
  }

  100%{
    opacity:1;
    transform:scale(1);
  }
}


/* =========================
   シールド
========================= */

.battleShield{
  position:absolute;
  width:92px;
  height:120px;
  z-index:5;
  transform:translate(-50%,-50%);
  border:5px solid currentColor;
  border-radius:
    50% 50% 45% 45% /
    18% 18% 72% 72%;

  opacity:0;

  box-shadow:
    0 0 12px currentColor,
    0 0 30px currentColor,
    inset 0 0 18px currentColor;

  background:
    radial-gradient(
      circle,
      transparent 35%,
      rgba(255,255,255,.08) 70%,
      transparent 72%
    );

  animation:shieldAppear .8s ease-out forwards;
}

.battleShield.p1{
  left:15%;
  top:75%;
  color:#69aaff;
}

.battleShield.p2{
  right:15%;
  top:25%;
  color:#69aaff;
}

@keyframes shieldAppear{

  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.45);
  }

  25%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.12);
  }

  100%{
    opacity:.9;
    transform:translate(-50%,-50%) scale(1);
  }

}


/* =========================
   ヒット表示
========================= */

.battleImpact{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.2);
  font-size:38px;
  font-weight:900;
  opacity:0;

  text-shadow:
    0 0 12px currentColor,
    0 0 28px currentColor;

  animation:impactFlash .45s ease-out forwards;
}

.battleImpact.hit{
  color:#ffcf4d;
}

.battleImpact.blocked{
  color:#65b5ff;
}

.battleImpact.clash{
  color:#fff;
}

.battleImpact.reflect{
  color:#d66cff;
}

.battleImpact.heal{
  color:#63ff8b;
}

@keyframes impactFlash{

  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.2);
  }

  30%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.35);
  }

  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.8);
  }

}


/* =========================
   スマホ対応
========================= */

@media(max-width:600px){

  .startTitle{
    font-size:30px;
  }

  .screenTitle{
    font-size:26px;
  }

  .playerArea{
    width:220px;
    padding:6px;
  }

  #player1Area{
    bottom:10px;
    left:10px;
  }

  #player2Area{
    top:10px;
    right:10px;
  }

  .action{
    min-height:36px;
  }

  .actionName{
    font-size:11px;
  }

  .actionKey{
    font-size:10px;
  }

  .modeChoiceBox{
    width:min(92vw,520px);
    min-height:190px;
    grid-template-columns:1fr;
    grid-template-rows:1fr 34px 1fr;
  }

  .modeSlash{
    min-height:34px;
  }

  .modeBottomButton{
    left:10px;
    bottom:10px;
    width:48px;
    height:48px;
    font-size:22px;
    border-radius:12px;
  }

  .modeSquareButton{
    right:10px;
    bottom:10px;
    width:64px;
    height:64px;
    font-size:27px;
    border-radius:14px;
  }

  .onlineMenu{
    width:88vw;
    margin-top:1vh;
    gap:10px;
  }

  .onlineMainButton{
    min-height:64px;
  }

  .onlineSubRow{
    gap:10px;
  }

  .onlineSubButton{
    min-height:48px;
  }

  .tipGrid{
    width:92vw;
    height:52vh;
    gap:7px;
  }

  .techSelect{
    width:92vw;
    gap:9px;
  }

  .techCard{
    min-height:145px;
    grid-template-columns:36px 1fr 36px;
    gap:5px;
    padding:8px;
    border-radius:14px;
  }

  .techArrow{
    width:36px;
    height:52px;
    font-size:20px;
  }

  .techCardDescription{
    font-size:11px;
  }

  #techConfirmButton{
    min-height:145px;
    padding:12px 8px;
  }

}


/* =========================
   心理バトル：対戦ゲームUI強化
========================= */
body{
  background:
    radial-gradient(circle at 50% 45%, #20263a 0%, #0b0d14 48%, #05060a 100%);
}

#battleScreen{
  background:
    radial-gradient(circle at 50% 50%, rgba(90,120,255,.10), transparent 34%),
    linear-gradient(135deg, rgba(255,70,90,.035), transparent 42%),
    linear-gradient(315deg, rgba(60,150,255,.035), transparent 42%);
}

#battleScreen::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.28;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:40px 40px;
  mask-image:linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
}

#battleScreen::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:55vw;
  height:55vw;
  max-width:700px;
  max-height:700px;
  transform:translate(-50%,-50%);
  border:1px solid rgba(150,180,255,.10);
  border-radius:50%;
  box-shadow:0 0 80px rgba(80,110,255,.08), inset 0 0 80px rgba(80,110,255,.05);
  pointer-events:none;
}

#countdownRing{
  position:absolute;
  left:50%;
  top:50%;
  width:55vw;
  height:55vw;
  max-width:700px;
  max-height:700px;
  transform:translate(-50%,-50%) rotate(0deg);
  border-radius:50%;
  background:conic-gradient(
    from 0deg,
    rgba(255,255,255,.95) 0deg 36deg,
    transparent 36deg 360deg
  );
  -webkit-mask:radial-gradient(
    farthest-side,
    transparent calc(100% - 4px),
    #000 calc(100% - 4px)
  );
  mask:radial-gradient(
    farthest-side,
    transparent calc(100% - 4px),
    #000 calc(100% - 4px)
  );
  opacity:0;
  --ring-angle:0deg;
  transform:translate(-50%,-50%) rotate(var(--ring-angle));
  pointer-events:none;
  z-index:2;
  filter:drop-shadow(0 0 5px rgba(255,255,255,.8)) drop-shadow(0 0 12px rgba(255,255,255,.35));
}

#countdownRing.active{
  opacity:1;
}

/* 10秒を10段階で進む。滑らかに回転させず、1秒ごとに36度ずつ進む。 */
#countdownRing.step{
  transform:translate(-50%,-50%) rotate(var(--ring-angle));
}

.playerArea{
  width:300px;
  padding:12px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:18px;
  background:linear-gradient(145deg, rgba(35,40,56,.92), rgba(12,14,22,.92));
  box-shadow:0 14px 40px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(8px);
  transition:transform .2s, box-shadow .2s, border-color .2s;
}

#player1Area{ border-color:rgba(255,75,90,.28); }
#player2Area{ border-color:rgba(80,150,255,.28); }

/* 2Pはバトル画面が実際に表示されている時だけ表示 */
#player2Area{display:none;}
#battleScreen.active #player2Area{display:block;}

.playerArea.locked{
  box-shadow:0 0 28px rgba(255,255,255,.08), 0 14px 40px rgba(0,0,0,.38);
}

.playerName{
  letter-spacing:2px;
  text-shadow:0 0 12px currentColor;
}
#player1Area .playerName{color:#ff6975;}
#player2Area .playerName{color:#70aaff;}

.hpBar{
  height:18px;
  border:1px solid rgba(255,255,255,.10);
  background:#090b10;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.6);
}
.statusTitle{
  font-size:13px;
  font-weight:700;
  line-height:1;
  margin-bottom:4px;
  color:#e8e8ef;
}

.statusBarRow{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  margin-bottom:8px;
}

.statusBarRow .hpBar,
.statusBarRow .gaugeBar{
  flex:1;
  min-width:0;
  margin-bottom:0;
}

.statusValue{
  flex:0 0 46px;
  text-align:right;
  font-size:17px;
  font-weight:800;
  letter-spacing:.5px;
  color:#fff;
}

.hpFill{
  background:linear-gradient(90deg,#19a85b,#62e88a,#19a85b);
  background-size:200% 100%;
  box-shadow:0 0 12px rgba(50,220,110,.55);
  transition:width .35s cubic-bezier(.2,.8,.2,1);
  animation:hpFlow 2s linear infinite;
}

.gaugeBar{
  height:12px;
  border:1px solid rgba(255,255,255,.10);
  background:#080b12;
}
.gaugeFill{
  background:linear-gradient(90deg,#3f82ff,#7fe8ff,#3f82ff);
  background-size:200% 100%;
  box-shadow:0 0 10px rgba(70,170,255,.55);
  transition:width .35s cubic-bezier(.2,.8,.2,1);
  animation:gaugeFlow 1.7s linear infinite;
}
.gaugeFill.gaugeReady{
  box-shadow:0 0 9px #68c9ff,0 0 22px rgba(70,160,255,.9),0 0 38px rgba(70,160,255,.5);
  animation:gaugeFlow .8s linear infinite, gaugePulse .7s ease-in-out infinite alternate;
}
.gaugeFill.gaugeMax{
  box-shadow:0 0 10px #fff,0 0 25px #6de4ff,0 0 50px rgba(80,180,255,.9);
}

.action{
  border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(145deg,#252b3a,#151923);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  transition:transform .12s, filter .12s, box-shadow .12s, border-color .12s;
}
.action:hover{
  transform:translateY(-2px);
  border-color:rgba(130,180,255,.55);
  box-shadow:0 0 16px rgba(80,150,255,.18), inset 0 1px 0 rgba(255,255,255,.08);
}
.action.disabled{filter:grayscale(.7);opacity:.22;}
.playerArea.locked .action:hover{transform:none;}

#countdown{
  font-size:clamp(54px,8vw,92px);
  letter-spacing:4px;
  text-shadow:0 0 14px rgba(255,255,255,.9),0 0 40px rgba(100,150,255,.8);
}
#countdown.countPulse{animation:countPulse .65s cubic-bezier(.2,.9,.2,1);}
#countdown.battleCall{
  color:#fff;
  font-size:clamp(42px,7vw,82px);
  text-shadow:0 0 15px #fff,0 0 35px #5da5ff,0 0 70px #5da5ff;
  animation:battleCall .9s cubic-bezier(.15,.9,.2,1) forwards;
}

#resultMessage{
  min-height:0;
  font-size:clamp(54px,10vw,120px);
  font-weight:1000;
  letter-spacing:7px;
  text-transform:uppercase;
  text-shadow:0 0 12px currentColor,0 0 35px currentColor,0 0 75px currentColor;
}
#resultMessage.resultShow{animation:resultReveal .9s cubic-bezier(.16,1,.3,1) forwards;}

.battleActionLabel{
  font-size:clamp(30px,4vw,52px);
  padding:10px 18px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
  border-top:1px solid currentColor;
  border-bottom:1px solid currentColor;
}

.battleProjectile{
  width:26px;
  height:26px;
  box-shadow:0 0 10px 5px currentColor,0 0 28px 12px currentColor,0 0 55px 18px rgba(255,255,255,.35);
}
.battleProjectile::after{
  content:"";
  position:absolute;
  width:90px;
  height:10px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:linear-gradient(90deg,transparent,currentColor,transparent);
  filter:blur(5px);
  opacity:.8;
}

.battleShield{
  border-width:4px;
  background:radial-gradient(circle,rgba(110,190,255,.22),rgba(70,130,255,.05) 45%,transparent 70%);
}
.battleShield.shieldBreak{animation:shieldBreak .45s ease-out forwards;}

.shieldShard{
  position:absolute;
  left:15%;
  top:75%;

  /* 大きなガラス片 */
  width:60px;
  height:40px;

  /* ガラスっぽい不規則な形 */
  clip-path:polygon(
    8% 18%,
    62% 0%,
    100% 28%,
    82% 88%,
    35% 100%,
    0% 62%
  );

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.95) 0%,
      rgba(190,225,255,.85) 18%,
      rgba(80,155,255,.65) 45%,
      rgba(20,90,190,.45) 70%,
      rgba(255,255,255,.15) 100%
    );

  border:1px solid rgba(255,255,255,.9);

  box-shadow:
    0 0 8px rgba(150,210,255,.95),
    0 0 22px rgba(80,160,255,.9),
    0 0 45px rgba(50,120,255,.55);

  transform:translate(-50%,-50%);
  animation:shieldShardBreak .7s cubic-bezier(.12,.8,.2,1) forwards;

  pointer-events:none;
  z-index:8;
}

.shieldShard.p2{
  left:85%;
  top:25%;
}

.punishBurst{
  position:absolute;
  width:300px;height:300px;
  transform:translate(-50%,-50%) scale(.2);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,35,45,.95) 0%,rgba(110,0,12,.85) 25%,rgba(15,0,0,.9) 52%,transparent 72%);
  box-shadow:0 0 35px #ff202f,0 0 90px rgba(70,0,0,.95),inset 0 0 35px #090000;
  animation:punishBurst .72s cubic-bezier(.12,.9,.18,1) forwards;
  pointer-events:none;
}
.punishSlash{
  position:absolute;
  width:500px;height:34px;
  transform:translate(-50%,-50%) rotate(-25deg) scaleX(0);
  border-radius:50%;
  background:linear-gradient(90deg,transparent,#160000,#ff2438,#65000a,#080000,transparent);
  box-shadow:0 0 18px #ff1d2e,0 0 42px #3b0005;
  animation:punishSlash .5s cubic-bezier(.15,.9,.2,1) forwards;
  pointer-events:none;
}
.punishRing{
  position:absolute;
  width:170px;height:170px;
  border:9px solid #4a0008;
  border-radius:50%;
  box-shadow:0 0 20px #ff1e32,0 0 55px rgba(45,0,0,.95),inset 0 0 20px #ff1e32;
  transform:translate(-50%,-50%) scale(.25);
  animation:punishRing .65s ease-out forwards;
  pointer-events:none;
}

.battleImpact{
  font-size:clamp(38px,6vw,72px);
  letter-spacing:3px;
}
.battleImpact.damageText{
  font-size:clamp(26px,4vw,48px);
  margin-top:90px;
}

/* ヒット時の画面揺れ */
#battleScreen.hitShake{animation:screenShake .28s linear;}

/* 汎用エフェクト */
.damageNumber{
  position:fixed;
  z-index:100000;
  font-size:clamp(26px,4vw,48px);
  font-weight:1000;
  color:#fff;
  text-shadow:0 0 8px #ff4f61,0 0 22px rgba(255,70,90,.8);
  pointer-events:none;
  animation:damageFloat .72s cubic-bezier(.15,.8,.2,1) forwards;
}

.hitBrightness{
  animation:hitBrightness .22s ease-out;
}

@keyframes damageFloat{
  0%{opacity:0;transform:translate(-50%,8px) scale(.7)}
  20%{opacity:1;transform:translate(-50%,0) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-46px) scale(1)}
}

@keyframes hitBrightness{
  0%{filter:brightness(1)}
  35%{filter:brightness(1.28)}
  100%{filter:brightness(1)}
}

.effectFlash,.effectRing,.effectSlash,.effectShockwave,.effectParticles,.effectHex,.effectAura,.effectLightning{
  position:absolute;
  left:50%;top:50%;
  pointer-events:none;
}
.effectFlash{
  width:100%;height:100%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.08) 20%,transparent 55%);
  animation:flashBurst .35s ease-out forwards;
}
.effectRing{
  width:80px;height:80px;
  border:4px solid currentColor;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(.2);
  box-shadow:0 0 18px currentColor, inset 0 0 18px currentColor;
  animation:ringBurst .65s cubic-bezier(.15,.8,.2,1) forwards;
}
.effectSlash{
  width:390px;height:18px;
  border-radius:50%;
  background:linear-gradient(90deg,transparent,#fff,currentColor,transparent);
  box-shadow:0 0 12px currentColor,0 0 28px currentColor;
  transform:translate(-50%,-50%) rotate(-25deg) scaleX(0);
  animation:slashBurst .42s cubic-bezier(.2,.9,.2,1) forwards;
}
.effectShockwave{
  width:60px;height:60px;
  border:5px solid currentColor;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(.2);
  animation:shockwave .55s ease-out forwards;
}
.effectHex{
  width:130px;height:130px;
  border:3px solid currentColor;
  clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  transform:translate(-50%,-50%) scale(.3) rotate(0deg);
  box-shadow:0 0 20px currentColor;
  animation:hexSeal .75s ease-out forwards;
}
.effectAura{
  width:220px;height:220px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.28),rgba(80,255,150,.12) 35%,transparent 70%);
  box-shadow:0 0 35px rgba(80,255,150,.55);
  transform:translate(-50%,-50%) scale(.35);
  animation:auraHeal .8s ease-out forwards;
}
.effectLightning{
  width:8px;height:260px;
  background:linear-gradient(transparent,#fff,currentColor,transparent);
  filter:drop-shadow(0 0 10px currentColor);
  transform:translate(-50%,-50%) rotate(25deg) scaleY(.2);
  animation:lightningStrike .42s ease-out forwards;
}

@keyframes hpDamage{0%{filter:brightness(1)}25%{filter:brightness(2.3)}55%{filter:brightness(.7)}100%{filter:brightness(1)}}
@keyframes hpFlow{to{background-position:200% 0;}}
@keyframes gaugeFlow{to{background-position:200% 0;}}
@keyframes gaugePulse{from{filter:brightness(1)}to{filter:brightness(1.55)}}
@keyframes countPulse{0%{opacity:0;transform:scale(1.8)}35%{opacity:1;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
@keyframes battleCall{0%{opacity:0;transform:scale(1.7)}35%{opacity:1;transform:scale(.92)}100%{opacity:0;transform:scale(1.08)}}
@keyframes resultReveal{0%{opacity:0;transform:scale(2.4) rotate(-4deg);filter:blur(10px)}55%{opacity:1;transform:scale(.92) rotate(1deg);filter:blur(0)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes screenShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,-4px)}80%{transform:translate(5px,3px)}}
@keyframes flashBurst{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
@keyframes ringBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.4)}}
@keyframes slashBurst{0%{opacity:0;transform:translate(-50%,-50%) rotate(-25deg) scaleX(0)}35%{opacity:1;transform:translate(-50%,-50%) rotate(-25deg) scaleX(1.1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-25deg) scaleX(1.35) translateX(30px)}}
@keyframes shockwave{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(4.5)}}
@keyframes hexSeal{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-25deg)}30%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25) rotate(15deg)}}
@keyframes auraHeal{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}}
@keyframes lightningStrike{0%{opacity:0;transform:translate(-50%,-50%) rotate(25deg) scaleY(.1)}35%{opacity:1;transform:translate(-50%,-50%) rotate(25deg) scaleY(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(25deg) scaleY(1.2)}}
@keyframes shieldBreak{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35);filter:brightness(2)}}
@keyframes shieldShardBreak{0%{opacity:1;transform:translate(-50%,-50%) rotate(0deg) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) rotate(180deg) scale(.25)}}
@keyframes punishBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}28%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.55)}}
@keyframes punishSlash{0%{opacity:0;transform:translate(-50%,-50%) rotate(-25deg) scaleX(0)}35%{opacity:1;transform:translate(-50%,-50%) rotate(-25deg) scaleX(1.15)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-25deg) scaleX(1.45) translateX(35px)}}
@keyframes punishRing{0%{opacity:0;transform:translate(-50%,-50%) scale(.25)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.7)}}

@media(max-width:600px){
  /* スマホでは親のoverflow:hiddenに演出が隠れないよう、演出レイヤーを画面固定で前面表示 */
  #battleEffectLayer{
    position:fixed;
    inset:0;
    z-index:9999;
    pointer-events:none;
    overflow:visible;
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
    will-change:transform;
  }

  .playerArea{
    width:calc(50vw - 15px);
    min-width:170px;
    z-index:10;
    touch-action:manipulation;
  }
  #player1Area{left:8px;bottom:8px;}
  #player2Area{right:8px;top:8px;}
  .actionList{gap:4px;}
  .action{
    min-height:48px;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-user-select:none;
    cursor:pointer;
    position:relative;
    z-index:11;
  }
  .actionName{font-size:10px;}
  .actionKey{font-size:9px;}
  .battleActionLabel{font-size:25px;padding:7px 10px;}
  .effectSlash{width:250px;}
  #battleCenter{z-index:3;pointer-events:none;}
}

</style>

</head>


<body>


<!-- =========================
     画面1：起動
========================= -->

<div id="startScreen"
     class="screen active"
     onclick="showScreen('modeScreen')">

  <div class="startTitle">
    心理バトル
  </div>

  <div class="startSub">
    タップしてスタート
  </div>

</div>


<!-- =========================
     画面2：モード選択
========================= -->

<div id="modeScreen" class="screen">

  <div class="modeChoiceBox" aria-label="バトルモード選択">
    <button class="modeChoiceButton" onclick="selectMode('offline')">
      オフライン
    </button>

    <div class="modeSlash" aria-hidden="true"></div>

    <button class="modeChoiceButton" onclick="selectMode('online')">
      オンライン
    </button>
  </div>

  <button class="modeBottomButton" aria-label="TIPを開く" onclick="showScreen('tipScreen')">📣</button>
  <button class="modeSquareButton" aria-label="メニュー">□</button>

</div>


<!-- =========================
     オンラインメニュー
========================= -->

<div id="onlineScreen" class="screen">

  <div class="screenTitle">オンライン</div>

  <div class="onlineMenu">
    <button class="onlineMainButton" onclick="startOnlineMatch('random')">ランダム対戦</button>
    <button class="onlineMainButton" onclick="startOnlineMatch('friend')">友達対戦</button>

    <div class="onlineSubRow">
      <button class="onlineSubButton" aria-label="ランキング">👑</button>
      <button class="onlineSubButton" aria-label="観戦" onclick="openSpectatorList()">👁</button>
    </div>
  </div>

  <button class="onlineBackButton" onclick="showScreen('modeScreen')">戻る</button>

</div>


<!-- =========================
     観戦一覧画面
========================= -->

<div id="spectatorListScreen" class="screen">
  <div class="screenTitle">観戦</div>
  <div id="spectatorList" class="spectatorList">
    <div class="spectatorEmpty">現在観戦できる対戦はありません。</div>
  </div>
  <button class="onlineBackButton" onclick="closeSpectatorList()">戻る</button>
</div>


<!-- =========================
     観戦画面
========================= -->

<div id="spectatorScreen" class="screen">
  <div class="screenTitle spectatorTitle">観戦中 <span id="spectatorMatchTitle"></span></div>
  <div id="spectatorBattleMirror" class="spectatorBattleMirror">
    <div class="spectatorReadOnly">観戦モード</div>
  </div>
  <button class="onlineBackButton" onclick="leaveSpectator()">観戦を終了</button>
</div>


<!-- =========================
     TIP画面
========================= -->

<div id="tipScreen" class="screen">
  <div class="tipNav" aria-label="TIPページ">
    <button class="tipNavButton active" data-page="0" onclick="showTipPage(0)">1</button>
    <button class="tipNavButton" data-page="1" onclick="showTipPage(1)">2</button>
    <button class="tipNavButton" data-page="2" onclick="showTipPage(2)">3</button>
    <button class="tipNavButton" data-page="3" onclick="showTipPage(3)">4</button>
  </div>

  <div class="tipViewport" aria-label="TIP内容">
    <div class="tipPages" id="tipPages">
      <section class="tipPage"><div class="tipPageInner">TIP 1</div></section>
      <section class="tipPage"><div class="tipPageInner">TIP 2</div></section>
      <section class="tipPage"><div class="tipPageInner">TIP 3</div></section>
      <section class="tipPage"><div class="tipPageInner">TIP 4</div></section>
    </div>
  </div>

  <button class="tipBackButton" onclick="showScreen('modeScreen')">戻る</button>

</div>


<!-- =========================
     画面3：技選択
========================= -->

<div id="techScreen" class="screen">

  <div id="techTitle" class="screenTitle">1P：技選択</div>

  <div class="techSelect">

    <div class="techCard">
      <button class="techArrow" onclick="changeTech(0,-1)" aria-label="前の技">＜</button>
      <div class="techCardBody">
        <div id="techIcon0" class="techIcon">技1</div>
        <div id="techCardDescription0" class="techCardDescription"></div>
      </div>
      <button class="techArrow" onclick="changeTech(0,1)" aria-label="次の技">＞</button>
    </div>

    <div class="techCard">
      <button class="techArrow" onclick="changeTech(1,-1)" aria-label="前の技">＜</button>
      <div class="techCardBody">
        <div id="techIcon1" class="techIcon">技2</div>
        <div id="techCardDescription1" class="techCardDescription"></div>
      </div>
      <button class="techArrow" onclick="changeTech(1,1)" aria-label="次の技">＞</button>
    </div>

    <div class="techCard">
      <button class="techArrow" onclick="changeTech(2,-1)" aria-label="前の技">＜</button>
      <div class="techCardBody">
        <div id="techIcon2" class="techIcon">技3</div>
        <div id="techCardDescription2" class="techCardDescription"></div>
      </div>
      <button class="techArrow" onclick="changeTech(2,1)" aria-label="次の技">＞</button>
    </div>

    <button id="techConfirmButton" class="confirmButton" onclick="confirmTech()">次へ</button>

  </div>

  <!-- 旧説明欄は互換用に残し、表示は技ボタン内へ統合 -->
  <div id="techDescription"></div>

</div>


<!-- =========================
     画面4：バトル
========================= -->

<div id="battleScreen"
     class="screen">


  <!-- 1P -->

  <div id="player1Area"
       class="playerArea">

    <div class="playerHeader">

      <div class="playerName">
        1P
      </div>

    </div>


    <div class="statusTitle">HP</div>

    <div class="statusBarRow">
      <div class="hpBar">
        <div
          id="hp1Fill"
          class="hpFill">
        </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getDatabase,
    ref,
    set,
    get,
    onValue,
    update,
    remove,
    onDisconnect
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC0SM6Z5NucrrG7jDy7uQ51QEHCbKghgFE",
    authDomain: "psy-5d3d1.firebaseapp.com",
    databaseURL: "https://psy-5d3d1-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "psy-5d3d1",
    storageBucket: "psy-5d3d1.firebasestorage.app",
    messagingSenderId: "1073764928812",
    appId: "1:1073764928812:web:a479a33f95edfedbb9f089"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let roomCode = null;
  let localPlayer = null;
  let onlineStarted = false;
  let roomListener = null;
  let presenceDisconnect = null;
  // 端末時計ではなくFirebaseの時刻を基準に、全端末で開始時刻を計算する。
  let serverTimeOffset = 0;
  onValue(ref(db, ".info/serverTimeOffset"), snap => {
    serverTimeOffset=Number(snap.val() || 0);
  });

  async function markLocalPlayerOnline(){
    if(!roomCode || !localPlayer) return;
    const presenceRef=ref(db, `rooms/${roomCode}/players/${localPlayer}/online`);
    await set(presenceRef, true);
    if(presenceDisconnect) await presenceDisconnect.cancel();
    presenceDisconnect=onDisconnect(presenceRef);
    await presenceDisconnect.set(false);
  }

  async function closeCurrentRoom(){
    const previousRoom=roomCode;
    const previousPlayer=localPlayer;
    if(roomListener){ roomListener(); roomListener=null; }
    if(presenceDisconnect){
      await presenceDisconnect.cancel();
      presenceDisconnect=null;
    }
    if(previousRoom && previousPlayer){
      await set(ref(db, `rooms/${previousRoom}/players/${previousPlayer}/online`), false);
    }
    roomCode=null;
    localPlayer=null;
    onlineStarted=false;
  }

  window.onlineBattle = {
    get roomCode(){ return roomCode; },
    get localPlayer(){ return localPlayer; },
    get active(){ return onlineStarted; },
    now(){ return Date.now()+serverTimeOffset; },

    async start(){
      // 前の部屋の監視・在席情報を必ず解除して、別試合の受信を混ぜない。
      await closeCurrentRoom();
      const create = confirm("新しい部屋を作りますか？\n\nOK：部屋を作る\nキャンセル：部屋コードで参加");

      if(create){
        roomCode = String(Math.floor(100000 + Math.random() * 900000));
        localPlayer = 1;
        onlineStarted = true;

        await set(ref(db, "rooms/" + roomCode), {
          createdAt: Date.now(),
          players: { "1": { joined: true, online: true } }
        });
        await markLocalPlayerOnline();

        alert("部屋を作りました！\n\n部屋コード：" + roomCode + "\n\n相手にこの6桁のコードを伝えてください。");
      }else{
        const code = prompt("参加する部屋の6桁コードを入力してください。");
        if(!code || !/^\d{6}$/.test(code)){
          alert("6桁の部屋コードを入力してください。");
          return false;
        }

        const snap = await get(ref(db, "rooms/" + code));
        if(!snap.exists()){
          alert("その部屋は見つかりません。");
          return false;
        }

        const data = snap.val();
        if(data.players && data.players["2"] && data.players["2"].joined){
          alert("その部屋は満員です。");
          return false;
        }

        roomCode = code;
        localPlayer = 2;
        onlineStarted = true;

        await update(ref(db, "rooms/" + roomCode), {
          "players/2/joined": true,
          "players/2/online": true
        });
        await markLocalPlayerOnline();

        alert("部屋に参加しました！");
      }

      listenRoom();
      return true;
    },

    async sendTechniques(indices){
      if(!onlineStarted || !roomCode || !localPlayer)return;
      await set(ref(db, `rooms/${roomCode}/players/${localPlayer}/techniques`), indices);
      await set(ref(db, `rooms/${roomCode}/players/${localPlayer}/ready`), true);
    },

    async sendAction(actionId, turnNumber){
      if(!onlineStarted || !roomCode || !localPlayer)return;
      await set(ref(db, `rooms/${roomCode}/turns/${turnNumber}/actions/${localPlayer}`), {
        id: actionId,
        time: Date.now()+serverTimeOffset
      });
    },

    async clearActions(turnNumber){
      if(!onlineStarted || !roomCode)return;
      await remove(ref(db, `rooms/${roomCode}/turns/${turnNumber}/actions`));
    },

    async publishBattleState(state){
      if(!onlineStarted || !roomCode)return;
      await set(ref(db, `rooms/${roomCode}/battle`), state);
    },

    async listActiveBattles(){
      const snap=await get(ref(db,"rooms"));
      const rooms=snap.val() || {};
      const activePhases=new Set(["starting","battle","countdown","effect"]);
      return Object.entries(rooms).filter(([code,room])=>{
        const b=room && room.battle;
        const p1=room?.players?.["1"];
        const p2=room?.players?.["2"];
        // 接続が残っている両対戦者の試合だけを観戦対象にする。
        if(!p1?.joined || !p2?.joined || !p1?.online || !p2?.online || !b)return false;
        if(!activePhases.has(String(b.phase || "")))return false;
        return true;
      }).map(([code,room])=>({
        roomCode:code,
        p1:room?.players?.["1"]?.name || "プレイヤー1",
        p2:room?.players?.["2"]?.name || "プレイヤー2",
        battle:room.battle
      }));
    },

    filterActiveBattles(rooms){
      const source=rooms || {};
      const activePhases=new Set(["starting","battle","countdown","effect"]);
      return Object.entries(source).filter(([code,room])=>{
        const b=room && room.battle;
        const p1=room?.players?.["1"];
        const p2=room?.players?.["2"];
        return !!(p1?.joined && p2?.joined && p1?.online && p2?.online && b && activePhases.has(String(b.phase || "")));
      }).map(([code,room])=>({
        roomCode:code,
        p1:room?.players?.["1"]?.name || "プレイヤー1",
        p2:room?.players?.["2"]?.name || "プレイヤー2",
        battle:room.battle
      }));
    },

    watchAllRooms(callback){
      const stop=onValue(ref(db,"rooms"),snap=>callback(snap.val() || {}));
      return stop;
    },

    watchRoom(roomCodeToWatch, callback){
      const stop=onValue(ref(db,`rooms/${roomCodeToWatch}`),snap=>callback(snap.val()));
      return stop;
    }
  };

  function listenRoom(){
    if(roomListener) roomListener();

    roomListener = onValue(ref(db, "rooms/" + roomCode), snap => {
      const data = snap.val();
      if(!data || !window.onlineBattle.active)return;

      const p1 = data.players && data.players["1"];
      const p2 = data.players && data.players["2"];

      function normalizeTechniques(value){
        if(Array.isArray(value)) return value;
        if(value && typeof value === "object") return Object.keys(value)
          .sort((a,b)=>Number(a)-Number(b)).map(key=>value[key]);
        return [];
      }

      const p1Techniques = normalizeTechniques(p1 && p1.techniques);
      const p2Techniques = normalizeTechniques(p2 && p2.techniques);
      const p1Ready = !!(p1 && p1.ready === true && p1Techniques.length === 3);
      const p2Ready = !!(p2 && p2.ready === true && p2Techniques.length === 3);

      if(p1Ready) window.receiveOnlineTechniques(1,p1Techniques);
      if(p2Ready) window.receiveOnlineTechniques(2,p2Techniques);

      // 両者がREADYになったら、P1が共通の開始時刻をFirebaseへ送る。
      // P1/P2とも同じstartAtを基準に約2秒後に1ターン目を開始する。
      if(p1Ready && p2Ready){
        window.startOnlineBattleIfReady();
      }

      // 相手が確定しても、自分の技選択UIは触らない。
      if(gameMode === "online" && !onlineBattleStarted){
        const meReady = localPlayer === 1 ? p1Ready : p2Ready;
        const bothReady = p1Ready && p2Ready;
        const button = document.getElementById("techConfirmButton");
        const title = document.getElementById("techTitle");
        if(meReady && !bothReady){
          if(button){ button.disabled=true; button.textContent="相手を待っています…"; }
          if(title) title.textContent="相手の技選択を待っています…";
        }
      }

      const battle = data.battle;
      if(battle && window.receiveOnlineBattleState){
        window.receiveOnlineBattleState(battle);
      }

      const turn = Number((battle && battle.turn) || onlineTurnNumber || 0);
      const opponent = localPlayer === 1 ? 2 : 1;
      const remoteAction = data.turns && data.turns[String(turn)] &&
        data.turns[String(turn)].actions &&
        data.turns[String(turn)].actions[String(opponent)];
      if(remoteAction && window.receiveOnlineAction){
        window.receiveOnlineAction(opponent, remoteAction.id, remoteAction.time, turn);
      }
    });
  }

  console.log("心理バトル Firebase接続成功");
</script>

  window._lastSpectatorEffectTurn=0;

  clearTimeout(window._spectatorCountdownTimer);
  clearTimeout(window._spectatorTechniqueRevealTimer);
  clearTimeout(window._spectatorEffectStartTimer);

  onlineBattleStarted=true;

  if(title)title.textContent=`${p1} VS ${p2}`;

  });

function receiveSpectatorBattleState(state,roomData){
  if(!spectatorActive || !state)return;
  gameMode="spectator";
  const turn=Number(state.turn||0);
  if(turn)onlineTurnNumber=turn;

  if(state.phase==="starting" || state.phase==="battle"){
    if(state.hp){hp={1:Number(state.hp[1]??hp[1]),2:Number(state.hp[2]??hp[2])};}
    if(state.gauge){gauge={1:Number(state.gauge[1]??gauge[1]),2:Number(state.gauge[2]??gauge[2])};}
    if(state.actions?.[1]?.data && state.actions?.[2]?.data){
      selectedAction[1]={id:state.actions[1].id,data:state.actions[1].data};
      selectedAction[2]={id:state.actions[2].id,data:state.actions[2].data};
    }
    updateSpectatorBattleUI();
    if(state.phase==="starting" && Number.isFinite(Number(state.startAt))){
      const startAt=Number(state.startAt);
      clearTimeout(window._spectatorStartTimer);
      window._spectatorStartTimer=setTimeout(()=>{
        if(!spectatorActive)return;
        updateSpectatorBattleUI();
      },Math.max(0,startAt-Date.now()));
    }
    return;
  }

  if(state.phase==="countdown" && Number.isFinite(Number(state.startAt))){
    if(state.actions?.[1]?.data && state.actions?.[2]?.data){
      selectedAction[1]={id:state.actions[1].id,data:state.actions[1].data};
      selectedAction[2]={id:state.actions[2].id,data:state.actions[2].data};
    }
    beginSpectatorCountdown(Number(state.startAt));
    return;
  }

  if(state.phase==="effect" && Number(state.resolvedTurn||0)>0){
    const effectTurn=Number(state.resolvedTurn);
    if(effectTurn<=Number(window._lastSpectatorEffectTurn||0))return;
    window._lastSpectatorEffectTurn=effectTurn;
    const a1=state.actions?.[1]?.data;
    const a2=state.actions?.[2]?.data;
    if(a1&&a2){
      selectedAction[1]={id:state.actions[1].id,data:a1};
      selectedAction[2]={id:state.actions[2].id,data:a2};
      if(state.blockSeal){
        blockSeal={1:Boolean(state.blockSeal[1]),2:Boolean(state.blockSeal[2])};
      }
      const revealAt=Number(state.revealAt || state.effectStartAt || onlineNow());
      const effectStartAt=Number(state.effectStartAt || (revealAt+ONLINE_REVEAL_MS));
      const receivedAt=onlineNow();
      const scheduleRevealAt=effectStartAt<=receivedAt ? receivedAt+50 : revealAt;
      const scheduleEffectAt=effectStartAt<=receivedAt ? scheduleRevealAt+ONLINE_REVEAL_MS : effectStartAt;
      clearTimeout(window._spectatorTechniqueRevealTimer);
      clearTimeout(window._spectatorEffectStartTimer);

      // 対戦者と同じFirebaseの絶対時刻で技名公開を再生する。
      window._spectatorTechniqueRevealTimer=setTimeout(()=>{
        if(!spectatorActive)return;
        showTechniqueReveal(a1,a2);
      },Math.max(0,scheduleRevealAt-onlineNow()));

      // 技名公開の1秒後、同じFirebaseの絶対時刻で演出を開始する。
      window._spectatorEffectStartTimer=setTimeout(()=>{
        if(!spectatorActive)return;
        clearOnlineTechniqueDescription();
        playBattleSituationSE(a1,a2,Number(state.damageTo1||0),Number(state.damageTo2||0));
        playBattleEffect(a1,a2,()=>{
          hp={1:Number(state.hp?.[1]??hp[1]),2:Number(state.hp?.[2]??hp[2])};
          gauge={1:Number(state.gauge?.[1]??gauge[1]),2:Number(state.gauge?.[2]??gauge[2])};
          updateSpectatorBattleUI();
        },Number(state.damageTo1||0),Number(state.damageTo2||0),true);
      },Math.max(0,scheduleEffectAt-onlineNow()));
    }
    return;
  }

  if(state.phase==="finished"){
    hp={1:Number(state.hp?.[1]??hp[1]),2:Number(state.hp?.[2]??hp[2])};
    gauge={1:Number(state.gauge?.[1]??gauge[1]),2:Number(state.gauge?.[2]??gauge[2])};
    updateSpectatorBattleUI();
    showBattleResult(state.result||"");
  }
}

function beginSpectatorCountdown(startAt){
  const el=document.getElementById("countdown");
  clearTimeout(window._spectatorCountdownTimer);
  const target=Number(startAt);
  let lastShown="";
  const tick=()=>{
    if(!spectatorActive)return;
    const ms=target-onlineNow();
    if(ms>0){
      const value=String(Math.min(3,Math.ceil(ms/1000)));
      if(el && value!==lastShown){
        lastShown=value;
        el.className="";
        void el.offsetWidth;
        el.className="countPulse";
        el.textContent=value;
      }
      window._spectatorCountdownTimer=setTimeout(tick,Math.min(100,Math.max(30,ms%1000||100)));
      return;
    }
    if(el && lastShown!=="BATTLE!"){
      lastShown="BATTLE!";
      el.className="battleCall";
      el.textContent="BATTLE!";
    }
  };
  tick();
}

/* =========================
   技選択
========================= */

let selectingPlayer = 1;

let selectedTechniques = {

  1:[0,1,2],

  2:[0,1,2]

};


function changeTech(slot,direction){

  const current =
    selectedTechniques[selectingPlayer][slot];

  const usedByOtherSlots =
    selectedTechniques[selectingPlayer]
      .filter((_,i) => i !== slot);

  let next = current;

  do{

    next += direction;

    if(next < 0){
      next = techniquePool.length - 1;
    }

    if(next >= techniquePool.length){
      next = 0;
    }

  }while(
    usedByOtherSlots.includes(next) &&
    next !== current
  );

  selectedTechniques[selectingPlayer][slot] = next;

  updateTechniqueDisplay();

}

   技表示
========================= */

function updateTechniqueDisplay(){

  selectedTechniques[selectingPlayer]
    .forEach((index,slot)=>{

      const tech = techniquePool[index];
      const nameEl = document.getElementById("techIcon" + slot);
      const descEl = document.getElementById("techCardDescription" + slot);

      if(nameEl) nameEl.textContent = tech.name;
      if(descEl) descEl.textContent = tech.description;

    });

  // 旧UIとの互換用。現在は表示しない。
  const oldDescription = document.getElementById("techDescription");
  if(oldDescription){
    oldDescription.innerHTML = selectedTechniques[selectingPlayer]
      .map(index => {
        const tech = techniquePool[index];
        return `<div><strong>${tech.name}</strong>：${tech.description}</div>`;
      }).join("");
  }
}


let player1Techs = [];

let player2Techs = [];


/* =========================
   技決定
========================= */

let onlineTurnStartedAt = 0;
let onlineTurnNumber = 0;
let onlineCountdownStarted = false;
let onlineBattleStarted = false;
let receivingOnlineAction = false;
let onlineTechConfirmed = false;
// 新しい部屋・再対戦時に古い非同期処理が状態を書き戻さないための世代番号。
let onlineMatchSession = 0;
// 2秒程度の回線遅延があっても、2Pが公開演出を受信してから再生できる余白。
const ONLINE_EVENT_LEAD_MS = 3200;
const ONLINE_REVEAL_MS = 1300;
const ONLINE_NEXT_TURN_LEAD_MS = 1500;
// オンラインの技は1タップ目を説明表示、同じ技の2タップ目で確定。
let onlineTechniquePreviewId = null;

function onlineNow(){
  return window.onlineBattle?.now?.() ?? Date.now();
}

function resetOnlineMatchState(){
  onlineMatchSession++;
  [
    "_onlineTechniqueRevealTimeout",
    "_onlineEffectStartTimeout",
    "_onlineStartTimeout",
    "_onlineCountdownTimeout"
  ].forEach(key=>clearTimeout(window[key]));
  clearInterval(countdownTimer);
  clearTimeout(countdownFinishTimeout);
  countdownTimer=null;
  countdownFinishTimeout=null;
  onlineCountdownStarted=false;
  turnResolving=false;
  window._lastOnlineEffectTurn=0;
  window._lastOnlineResolvedTurn=0;
  window._lastOnlineStateTurnReceived=0;
  window._onlineStateTurnStarted=0;
  window._resolvingOnlineTurn=0;
  window._onlineInitialStarted=0;
  window._onlineCountdownKey=null;
  clearOnlineTechniqueDescription();
  const layer=document.getElementById("battleEffectLayer");
  if(layer) layer.innerHTML="";
}

function receiveOnlineTechniques(player, indices){

  // Firebaseから配列ではなくオブジェクトで届く場合にも対応
  let list = [];

  if(Array.isArray(indices)){
    list = indices.slice();
  }else if(indices && typeof indices === "object"){
    list = Object.keys(indices)
      .sort((a,b) => Number(a) - Number(b))
      .map(key => indices[key]);
  }

  const techs = list
    .map(index => techniquePool[Number(index)])
    .filter(Boolean);

  if(techs.length !== 3) return;

  // ここでは「相手の確定した技」を保存するだけ。
  // 相手の確定を受信したことで、自分の技選択UIをロックしない。
  if(player === 1){
    player1Techs = techs;
  }else{
    player2Techs = techs;
  }

  if(player1Techs.length === 3 && player2Techs.length === 3){
    setupActionNames();
  }
}

function maybeStartOnlineBattle(){
  if(gameMode !== "online") return;
  if(onlineBattleStarted) return;
  if(player1Techs.length !== 3 || player2Techs.length !== 3) return;

  // P1だけがオンライン対戦の初期状態を書き込む。
  if(window.onlineBattle.localPlayer === 1){
    onlineBattleStarted = true;
    onlineTurnNumber = 1;
    const button = document.getElementById("techConfirmButton");
    if(button){ button.disabled=true; button.textContent="READY!"; }
    const title = document.getElementById("techTitle");
    if(title) title.textContent="READY! 同期後に対戦開始…";
    const battle = {
      phase:"starting", turn:1, startAt:onlineNow()+ONLINE_EVENT_LEAD_MS,
      hp:{1:10,2:10}, gauge:{1:0,2:0},
      lastAction:{1:null,2:null}, lastLastAction:{1:null,2:null},
      momentumBonus:{1:false,2:false}, blockSeal:{1:false,2:false},
      resolvedTurn:0, result:""
    };
    window.onlineBattle.publishBattleState(battle).then(()=>{
      // ホスト自身もFirebase状態と同じ開始処理を行う。
      if(window._onlineInitialStarted !== 1){
        window._onlineInitialStarted=1;
        setupBattleFromOnlineState(battle);
      }
    }).catch(console.error);
  }else{
    // P2はFirebaseのbattle状態を待つ。
    const button = document.getElementById("techConfirmButton");
    if(button){ button.disabled=true; button.textContent="対戦開始を待っています…"; }
  }
}

window.startOnlineBattleIfReady = maybeStartOnlineBattle;

function receiveOnlineAction(player, actionId, timestamp, turnNumber){
  if(gameMode !== "online") return;
  if(player === window.onlineBattle.localPlayer) return;
  if(Number(turnNumber) !== onlineTurnNumber) return;
  if(!timestamp || selectedAction[player]) return;
  const data = getActionData(player, actionId);
  if(!data) return;

  selectedAction[player] = {id:actionId, data:data};
  locked[player] = true;
  const area=document.getElementById("player"+player+"Area");
  if(area) area.classList.add("locked");

  // オンラインではP1が両者の行動が揃ったことを確認し、
  // Firebaseで共通の開始時刻を発行する。
  if(selectedAction[1] && selectedAction[2] && window.onlineBattle.localPlayer === 1){
    startOnlineBattleCountdownIfReady();
  }
}

function beginOnlineBattleCountdown(startAt){
  if(gameMode !== "online") return;
  if(!Number.isFinite(Number(startAt))) return;

  const target = Number(startAt);
  const countdownKey=`${onlineTurnNumber}:${target}`;
  // onValueは行動の書き込み・削除でも同じbattle状態を再通知する。
  // 同一ターンの3秒カウントを作り直さない。
  if(window._onlineCountdownKey===countdownKey) return;
  window._onlineCountdownKey=countdownKey;
  onlineCountdownStarted = true;
  clearInterval(countdownTimer);
  clearTimeout(window._onlineCountdownTimeout);
  countdownTimer = null;

  const el = document.getElementById("countdown");

  const show = value => {
    if(!el) return;
    el.className = "";
    void el.offsetWidth;
    el.className = "countPulse";
    el.textContent = String(value);
  };

  const tick = () => {
    const remainingMs = target - onlineNow();

    if(remainingMs > 0){
      show(Math.min(3, Math.ceil(remainingMs / 1000)));
      countdownTimer = setTimeout(tick, Math.max(50, remainingMs % 1000 || 50));
      return;
    }

    countdownTimer = null;
    countdown = 0;

    if(el){
      el.className = "battleCall";
      el.textContent = "BATTLE!";
    }

    clearTimeout(window._onlineCountdownTimeout);
    window._onlineCountdownTimeout = setTimeout(()=>{
      if(gameMode === "online" && window.onlineBattle.localPlayer === 1 &&
         selectedAction[1] && selectedAction[2]){
        finishTurn();
      }
    },500);
  };

  tick();
}

function startOnlineBattleCountdownIfReady(){
  if(gameMode !== "online") return;
  if(!selectedAction[1] || !selectedAction[2]) return;
  if(onlineCountdownStarted) return;

  // P1だけが共通の開始時刻をFirebaseへ発行する。
  if(window.onlineBattle.localPlayer !== 1) return;

  stopCountdownRing();
  stopTurnCountdownSE();

  const startAt = onlineNow() + ONLINE_EVENT_LEAD_MS;
  const battle = {
    phase: "countdown",
    turn: onlineTurnNumber,
    startAt,
    actions: {
      1: {id: selectedAction[1].id, data: selectedAction[1].data},
      2: {id: selectedAction[2].id, data: selectedAction[2].data}
    }
  };

  onlineCountdownStarted = true;
  window.onlineBattle.publishBattleState(battle).catch(console.error);
  // P1もFirebaseから受け取った状態だけで開始する。ローカル即時開始との二重化を防ぐ。
}

function applyOnlineBlockSealState(nextSeal){
  if(!nextSeal)return;
  for(const side of [1,2]){
    if(nextSeal[side] === true){
      blockSeal[side] = true;
    }else if(nextSeal[side] === false){
      // Firebaseの古いfalseで封印を勝手に消さない。
      // 封印された本人のゲージが7以上になった場合だけ解除する。
      if(Number(gauge[side] || 0) >= 7){
        blockSeal[side] = false;
      }
    }
  }
}

function receiveOnlineBattleState(state){
  if(gameMode !== "online" || !state) return;
  const turn=Number(state.turn||0);
  if(!turn) return;
  onlineTurnNumber=turn;

  // 両端末が同じFirebaseのstartAtを基準に3→2→1→BATTLE!を表示する。
  if(state.phase === "countdown" && Number.isFinite(Number(state.startAt))){
    const a1 = state.actions?.[1];
    const a2 = state.actions?.[2];

    if(a1?.data && a2?.data){
      selectedAction[1] = {id:a1.id, data:a1.data};
      selectedAction[2] = {id:a2.id, data:a2.data};
      locked[1] = true;
      locked[2] = true;
      document.getElementById("player1Area")?.classList.add("locked");
      document.getElementById("player2Area")?.classList.add("locked");
    }

    beginOnlineBattleCountdown(Number(state.startAt));
    return;
  }

  // オンライン演出：1P/2Pとも同じ技公開時刻・演出開始時刻を使う。
  if(state.phase === "effect" && Number(state.resolvedTurn || 0) > 0){
    const effectTurn = Number(state.resolvedTurn);
    if(effectTurn <= Number(window._lastOnlineEffectTurn || 0)) return;

    const a1 = state.actions?.[1];
    const a2 = state.actions?.[2];
    if(!a1?.data || !a2?.data) return;
    window._lastOnlineEffectTurn = effectTurn;
    const session=onlineMatchSession;

    applyOnlineBlockSealState(state.blockSeal);

    // 技公開も演出もFirebaseが配信した共通の絶対時刻で再生する。
    // 1Pだけ先にローカル再生する経路をなくし、2Pの技公開抜け・遅延を防ぐ。
    const revealAt = Number(state.revealAt || (onlineNow()+ONLINE_EVENT_LEAD_MS));
    const effectStartAt = Number(state.effectStartAt || (revealAt+ONLINE_REVEAL_MS));
    // 想定以上の遅延で開始時刻を過ぎていた場合も、公開と演出を同じ瞬間に
    // 潰さず、2P側では公開時間を確保してから再生する。
    const receivedAt=onlineNow();
    const scheduleRevealAt=effectStartAt<=receivedAt ? receivedAt+50 : revealAt;
    const scheduleEffectAt=effectStartAt<=receivedAt ? scheduleRevealAt+ONLINE_REVEAL_MS : effectStartAt;

    clearTimeout(window._onlineTechniqueRevealTimeout);
    clearTimeout(window._onlineEffectStartTimeout);

    window._onlineTechniqueRevealTimeout=setTimeout(()=>{
      if(session!==onlineMatchSession || gameMode!=="online" || Number(onlineTurnNumber)!==Number(state.turn))return;
      showTechniqueReveal(a1.data,a2.data);
    },Math.max(0,scheduleRevealAt-onlineNow()));

    window._onlineEffectStartTimeout=setTimeout(()=>{
      if(session!==onlineMatchSession || gameMode!=="online" || Number(onlineTurnNumber)!==Number(state.turn))return;
      clearOnlineTechniqueDescription();
      playBattleSituationSE(
        a1.data,
        a2.data,
        Number(state.damageTo1||0),
        Number(state.damageTo2||0)
      );
      playBattleEffect(
        a1.data,
        a2.data,
        ()=>{
          if(session!==onlineMatchSession || gameMode!=="online" || Number(onlineTurnNumber)!==Number(state.turn)) return;
          hp={1:Number(state.hp?.[1] ?? hp[1]),2:Number(state.hp?.[2] ?? hp[2])};
          gauge={1:Number(state.gauge?.[1] ?? gauge[1]),2:Number(state.gauge?.[2] ?? gauge[2])};
          lastAction=state.lastAction||lastAction;
          lastLastAction=state.lastLastAction||lastLastAction;
          momentumBonus=state.momentumBonus||momentumBonus;
          applyOnlineBlockSealState(state.blockSeal);
          updateBattleUI();

          // 次ターンの開始はここでは行わない。
          // P1/P2ともFirebaseのbattle状態を受信し、同じstartAtでstartTurn()する。
          if(window.onlineBattle.localPlayer===1 && Number(onlineTurnNumber)===Number(state.turn)){
            if(state.result){
              showBattleResult(state.result);
              return;
            }
            const finishedTurn=Number(state.resolvedTurn || state.turn);
            const nextTurn=finishedTurn+1;
            const nextStartAt=onlineNow()+ONLINE_NEXT_TURN_LEAD_MS;

            lastLastAction[1] = lastAction[1];
            lastLastAction[2] = lastAction[2];
            lastAction[1] = {id:a1.id,data:a1.data};
            lastAction[2] = {id:a2.id,data:a2.data};
           // モーメンタムは連続使用するたびに 1 → 2 → 1 → 2 と交互にする。
if(a1.skill === "tech6"){
  momentumBonus[1] = !momentumBonus[1];
}else{
  momentumBonus[1] = false;
}

if(a2.skill === "tech6"){
  momentumBonus[2] = !momentumBonus[2];
}else{
  momentumBonus[2] = false;
}

            const nextState={
              phase:"battle",
              turn:nextTurn,
              startAt:nextStartAt,
              resolvedTurn:finishedTurn,
              actions:{1:{id:a1.id,data:a1.data},2:{id:a2.id,data:a2.data}},
              hp:{1:hp[1],2:hp[2]},
              gauge:{1:gauge[1],2:gauge[2]},
              lastAction,
              lastLastAction,
              momentumBonus,
              blockSeal,
              result:""
            };

            window._lastOnlineResolvedTurn=finishedTurn;
            window.onlineBattle.publishBattleState(nextState).catch(console.error);
            window.onlineBattle.clearActions(finishedTurn).catch(console.error);
          }
        },
        Number(state.damageTo1||0),
        Number(state.damageTo2||0)
      );
    },Math.max(0,scheduleEffectAt-onlineNow()));
    return;
  }

  if(state.phase === "starting"){
    if(!onlineBattleStarted){
      onlineBattleStarted=true;
      hp={1:Number(state.hp?.[1] ?? 10),2:Number(state.hp?.[2] ?? 10)};
      gauge={1:Number(state.gauge?.[1] ?? 0),2:Number(state.gauge?.[2] ?? 0)};
      lastAction=state.lastAction||{1:null,2:null};
      lastLastAction=state.lastLastAction||{1:null,2:null};
      momentumBonus=state.momentumBonus||{1:false,2:false};
      applyOnlineBlockSealState(state.blockSeal);
      setupBattleFromOnlineState(state);
      return;
    }
  }

  // 次ターン開始も1P/2Pで完全に同じ経路にする。
  // Firebaseが配信した同じstartAtを、両端末が受信して同じ時刻にstartTurn()する。
  if(state.phase === "battle" && Number(state.turn || 0) > 0){
    const nextTurn=Number(state.turn);
    if(nextTurn <= Number(window._lastOnlineStateTurnReceived || 0)) return;
    window._lastOnlineStateTurnReceived=nextTurn;

    hp={1:Number(state.hp?.[1] ?? hp[1]),2:Number(state.hp?.[2] ?? hp[2])};
    gauge={1:Number(state.gauge?.[1] ?? gauge[1]),2:Number(state.gauge?.[2] ?? gauge[2])};
    lastAction=state.lastAction||lastAction;
    lastLastAction=state.lastLastAction||lastLastAction;
    momentumBonus=state.momentumBonus||momentumBonus;
    applyOnlineBlockSealState(state.blockSeal);
    updateBattleUI();

    const startAt=Number(state.startAt || onlineNow());
    clearTimeout(window._onlineStartTimeout);
    window._onlineStartTimeout=setTimeout(()=>{
      if(gameMode!=="online" || onlineTurnNumber!==nextTurn)return;
      if(window._onlineStateTurnStarted===nextTurn)return;
      window._onlineStateTurnStarted=nextTurn;
      startTurn();
    },Math.max(0,startAt-onlineNow()));
    return;
  }

  if(Number(state.resolvedTurn||0) > Number(window._lastOnlineResolvedTurn||0)){
    window._lastOnlineResolvedTurn=Number(state.resolvedTurn);
    const a1=state.actions?.[1];
    const a2=state.actions?.[2];
    const apply=()=>{
      hp={1:Number(state.hp?.[1] ?? hp[1]),2:Number(state.hp?.[2] ?? hp[2])};
      gauge={1:Number(state.gauge?.[1] ?? gauge[1]),2:Number(state.gauge?.[2] ?? gauge[2])};
      lastAction=state.lastAction||lastAction;
      lastLastAction=state.lastLastAction||lastLastAction;
      momentumBonus=state.momentumBonus||momentumBonus;
      applyOnlineBlockSealState(state.blockSeal);
      updateBattleUI();
      if(state.result) showBattleResult(state.result);
      else {
        const wait=Math.max(0,Number(state.startAt||onlineNow())-onlineNow());
        clearTimeout(window._onlineStartTimeout);
        window._onlineStartTimeout=setTimeout(()=>{
          if(gameMode!=="online" || onlineTurnNumber!==Number(state.turn))return;
          if(window._onlineStateTurnStarted===Number(state.turn))return;
          window._onlineStateTurnStarted=Number(state.turn);
          startTurn();
        },wait);
      }
    };
    if(window.onlineBattle.localPlayer===1){
      if(state.result){
        showBattleResult(state.result);
      }else{
        const wait=Math.max(0,Number(state.startAt||onlineNow())-onlineNow());
        clearTimeout(window._onlineStartTimeout);
        window._onlineStartTimeout=setTimeout(()=>{
          if(gameMode!=="online" || onlineTurnNumber!==Number(state.turn))return;
          if(window._onlineStateTurnStarted===Number(state.turn))return;
          window._onlineStateTurnStarted=Number(state.turn);
          startTurn();
        },wait);
      }
    }else if(a1 && a2){
      if(Number(state.resolvedTurn) <= Number(window._lastOnlineEffectTurn || 0)){
        apply();
      }else{
        window._lastOnlineEffectTurn=Number(state.resolvedTurn);
        playBattleSituationSE(
          a1,
          a2,
          Number(state.damageTo1 || 0),
          Number(state.damageTo2 || 0)
        );
        playBattleEffect(
          a1,
          a2,
          apply,
          Number(state.damageTo1 || 0),
          Number(state.damageTo2 || 0)
        );
      }
    }else{
      apply();
    }
  }
}

function setCountdownRingStep(step){
  const ring=document.getElementById("countdownRing");
  if(!ring)return;
  const safeStep=Math.max(0,Math.min(9,Number(step)||0));
  ring.style.setProperty("--ring-angle",(safeStep*36)+"deg");
}

function startCountdownRing(){
  const ring=document.getElementById("countdownRing");
  if(!ring)return;
  ring.classList.remove("active");
  ring.classList.remove("step");
  setCountdownRingStep(0);
  void ring.offsetWidth;
  ring.classList.add("active","step");
}

function stopCountdownRing(){
  const ring=document.getElementById("countdownRing");
  if(!ring)return;
  ring.classList.remove("active","step");
}

function startTurnCountdownSE(){
  const audio=document.getElementById("turnCountdownSE");
  if(!audio)return;
  audio.loop=true;
  audio.volume=0.28;
  if(!audio.paused)return;
  const promise=audio.play();
  if(promise && typeof promise.catch==="function") promise.catch(()=>{});
}

function stopTurnCountdownSE(){
  const audio=document.getElementById("turnCountdownSE");
  if(!audio)return;
  audio.pause();
  audio.currentTime=0;
}

/* =========================
   ターン開始
========================= */

function startTurn(){

  // 前ターンに残っていたタイマーを完全に破棄
  clearInterval(countdownTimer);
  countdownTimer = null;
  clearTimeout(countdownFinishTimeout);
  countdownFinishTimeout = null;

  onlineCountdownStarted = false;
  window._onlineCountdownKey = null;
  onlineTurnStartedAt = Date.now();
  if(gameMode === "online" && onlineTurnNumber === 0) onlineTurnNumber = 1;

  selectedAction[1] = null;
  selectedAction[2] = null;
  onlineTechniquePreviewId = null;

  locked[1] = false;
  locked[2] = false;

  // 新しいターンなので二重処理ロックを解除
  turnResolving = false;

  document.getElementById("player1Area").classList.remove("locked");
  document.getElementById("player2Area").classList.remove("locked");
  document.getElementById("resultMessage").textContent = "";
  clearOnlineTechniqueDescription();

  updateDisabledActions();

  // 行動選択時間：10秒
  countdown = 10;
  const el = document.getElementById("countdown");
  el.className = "countPulse";
  el.textContent = "10";

  startCountdownRing();
  startTurnCountdownSE();

  countdownTimer = setInterval(()=>{
    countdown--;

    if(countdown > 0){
      el.className = "";
      void el.offsetWidth;
      el.className = "countPulse";
      el.textContent = countdown;
      setCountdownRingStep(10 - countdown);
      return;
    }

    if(countdown === 0){
      stopCountdownRing();
      stopTurnCountdownSE();
      el.className = "battleCall";
      el.textContent = "BATTLE!";

      clearTimeout(countdownFinishTimeout);
      countdownFinishTimeout = setTimeout(()=>{
        countdownFinishTimeout = null;
        if(countdown === 0) finishTurn();
      },500);
    }

    clearInterval(countdownTimer);
    countdownTimer = null;
  },1000);
}

// スマホではclickだけだと機種・ブラウザによって反応が遅れたり
// 取りこぼしたりすることがあるため、pointerupでも直接処理する。
// pointerupの後に発生するclickとの二重処理は抑止する。
let lastActionPointerTarget = null;
let lastActionPointerTime = 0;

function handleActionPointer(event){

  const actionElement =
    event.target.closest(".action");

  if(!actionElement){
    return;
  }

  // バトル画面の行動ボタン以外は無視
  if(!actionElement.closest("#battleScreen")){
    return;
  }

  const player =
    Number(actionElement.dataset.player);

  const action =
    actionElement.dataset.action;

  if(!player || !action){
    return;
  }

  lastActionPointerTarget = actionElement;
  lastActionPointerTime = Date.now();

  // 技選択中に行動ボタンが押されたら決定ボタン38を鳴らす。
  playBattleSE("seDecision38");
  chooseAction(player, action);
}

// スマホ・タブレット・ペン・マウスを含むPointer Events
document.addEventListener(
  "pointerup",
  handleActionPointer,
  {passive:true}
);

// PCのclickにも対応。
// pointerup直後の同じclickだけは二重処理しない。
document.addEventListener(
  "click",
  event => {

    const actionElement =
      event.target.closest(".action");

    if(!actionElement){
      return;
    }

    if(!actionElement.closest("#battleScreen")){
      return;
    }

    const now = Date.now();

    if(
      actionElement === lastActionPointerTarget &&
      now - lastActionPointerTime < 800
    ){
      return;
    }

    const player =
      Number(actionElement.dataset.player);

    const action =
      actionElement.dataset.action;

    if(player && action){
      chooseAction(player, action);
    }

  }
);
